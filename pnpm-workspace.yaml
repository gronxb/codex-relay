packages:
  - apps/*
  - packages/*
allowBuilds:
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  react-native-enriched-markdown: true
  sharp: true
  workerd: true

blockExoticSubdeps: false

nodeLinker: hoisted

minimumReleaseAge: 0

overrides:
  "@libsql/isomorphic-ws>ws": 8.21.0
  # Scratch QA of gronxb/hot-updater preview-ci-speed: every package from that branch, packed.
  hot-updater: file:vendor/hot-updater/hot-updater-1.2.0-rc.44.tgz
  "@hot-updater/android-helper": file:vendor/hot-updater/hot-updater-android-helper-1.2.0-rc.44.tgz
