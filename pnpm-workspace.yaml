packages:
  - apps/*
  - packages/*
allowBuilds:
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  react-native-enriched-markdown: true
  sharp: true
  workerd: true

blockExoticSubdeps: false

nodeLinker: hoisted

minimumReleaseAge: 0

overrides:
  "@libsql/isomorphic-ws>ws": 8.21.0
  # QA only: Hot Updater 1.2.0-rc.26 from npm, exact, for every package the app pulls in.
  "@hot-updater/react-native": 1.2.0-rc.26
  "@hot-updater/android-helper": 1.2.0-rc.26
  "@hot-updater/apple-helper": 1.2.0-rc.26
  "@hot-updater/cli-tools": 1.2.0-rc.26
  hot-updater: 1.2.0-rc.26
  "@hot-updater/protocol": 1.2.0-rc.26
  "@hot-updater/plugin-core": 1.2.0-rc.26
  "@hot-updater/server": 1.2.0-rc.26
