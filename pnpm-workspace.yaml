packages:
  - apps/*
  - packages/*
allowBuilds:
  dtrace-provider: false
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
  react-native-enriched-markdown: true
  sharp: true
  workerd: true

blockExoticSubdeps: false

nodeLinker: hoisted

minimumReleaseAge: 0

overrides:
  "@libsql/isomorphic-ws>ws": 8.21.0
  # QA only: Hot Updater next (sandbox native UI) packed from the repo, before the next RC.
  "@hot-updater/react-native": file:./vendor/hot-updater/hot-updater-react-native-1.2.0-rc.24.3.tgz
  "@hot-updater/android-helper": file:./vendor/hot-updater/hot-updater-android-helper-1.2.0-rc.24.3.tgz
  "@hot-updater/apple-helper": file:./vendor/hot-updater/hot-updater-apple-helper-1.2.0-rc.24.3.tgz
  "@hot-updater/cli-tools": file:./vendor/hot-updater/hot-updater-cli-tools-1.2.0-rc.24.3.tgz
  hot-updater: file:./vendor/hot-updater/hot-updater-1.2.0-rc.24.3.tgz
  # The native build registration (sandbox_url_scheme) lives in server, plugin-core and protocol.
  "@hot-updater/protocol": file:./vendor/hot-updater/hot-updater-protocol-1.2.0-rc.24.3.tgz
  "@hot-updater/plugin-core": file:./vendor/hot-updater/hot-updater-plugin-core-1.2.0-rc.24.3.tgz
  "@hot-updater/server": file:./vendor/hot-updater/hot-updater-server-1.2.0-rc.24.3.tgz
