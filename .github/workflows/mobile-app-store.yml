name: Mobile App Store

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-app-store-production
  cancel-in-progress: false

jobs:
  build-and-submit-ios:
    name: Build and submit iOS
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Validate Expo dependencies
        working-directory: apps/mobile
        run: pnpm expo install --check

      - name: Typecheck mobile app
        working-directory: apps/mobile
        run: pnpm typecheck

      - name: Build and submit iOS
        working-directory: apps/mobile
        run: eas build --platform ios --profile production --auto-submit --non-interactive --no-wait
