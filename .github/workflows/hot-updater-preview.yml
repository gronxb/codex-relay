# Hot Updater 1.2 sandbox QA (Hot Updater 1.2.0-rc.42 from npm, actions/preview at its release commit).
# The iOS sandbox build (scheme `adhoc`) is an ad hoc .ipa for the iPhones in the Console's
# device registry, and the Android one (scheme `apk`) a direct .apk. A sandbox build lives on
# the channel of the pull request whose native change built it (pr-<number>), and every later
# pull request with the same native code reuses it. Every run deploys this pull request's
# bundle to pr-<number>; the comment carries the install links and the sandbox link that opens
# the bundle in the sandbox build. Closing the pull request deletes its bundles; the sandbox
# builds stay. Production is never touched.
name: Hot Updater preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  # infisical() signs in with GitHub OIDC (INFISICAL_MACHINE_IDENTITY_ID).
  id-token: write

concurrency:
  group: hot-updater-preview-${{ github.event.pull_request.number }}
  # A newer push waits instead of cancelling a native build in flight.
  cancel-in-progress: false

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # The 260 MB release .apk runs out of memory in Gradle's default 2 GB heap.
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx5g
      # hot-updater.config.ts reads every credential (Cloudflare, the bundle signing key,
      # the App Store Connect API key, the release keystore) from Infisical, signed in
      # with GitHub OIDC as a read-only (Viewer) machine identity.
      INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The pull request's own commit, not its merge into main, as the docs set it:
          # the comment's "Latest commit" and the deploy message name this commit.
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # apps/mobile's Gemfile runs CocoaPods through bundler (Ruby 3.3: 3.2 crashes pod install).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile
      # The Android sandbox .apk builds with Gradle on JDK 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      # The app's EXPO_PUBLIC_* values (the update server and its API key).
      - name: Restore the app environment
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
      # The update server's client API key for the native build: app.config.ts reads
      # HOT_UPDATER_API_KEY from .env.hotupdater.rc22 into extra.hotUpdaterApiKey.
      # Only that one name is pulled from Infisical; the file holds nothing else.
      - name: Pull the app's client API key
        working-directory: apps/mobile
        run: |
          umask 077
          pnpm exec hot-updater secrets pull --only HOT_UPDATER_API_KEY --out .env.hotupdater.rc22 --force < /dev/null
          grep -c '^HOT_UPDATER_API_KEY=.' .env.hotupdater.rc22
      - uses: gronxb/hot-updater/actions/preview@f5fbb05ec87160fc1dfb1f83646e0d4c1543803c
        with:
          console-url: https://codex-relay.gron-studio.com
          platforms: android,ios
          # The default Android path: the sandbox .apk, downloaded from the Console's build
          # page (com.gronstudio.codexrelay.sandbox). Google Play internal testing stays
          # available as the `play` scheme with `android-submit: play-internal`.
          android-scheme: apk
          # The sandbox exported ad hoc for the iPhones in the Console's device registry,
          # installed from the Console's build page. TestFlight internal testing stays
          # available as the `testflight` scheme with `ios-submit: testflight`.
          ios-scheme: adhoc
          working-directory: apps/mobile
          cli: pnpm exec hot-updater
