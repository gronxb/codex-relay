# v1.2 QA: Hot Updater's pull request previews on codex-relay (actions/preview, hot-updater 1.2.0-rc.1).
# Every run deploys this pull request's bundle to its pr-<number> channel and, unless the registry
# already has an iOS Simulator build for the project's fingerprint there, builds and registers one
# that embeds that channel (app.config.ts reads PREVIEW_CHANNEL). The comment links the build's
# download. Closing the pull request deletes the channel with its bundles and native builds.
# Production's channel is never touched.
name: Hot Updater preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: hot-updater-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # app.config.ts passes this to the @hot-updater/expo config plugin, so the preview build
      # embeds the pull request's channel (the action's default channel, pr-<number>).
      PREVIEW_CHANNEL: pr-${{ github.event.number }}
      # Deploy credentials, read by hot-updater.config.ts through the env() secrets adapter.
      HOT_UPDATER_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.HOT_UPDATER_CLOUDFLARE_ACCOUNT_ID }}
      HOT_UPDATER_CLOUDFLARE_API_TOKEN: ${{ secrets.HOT_UPDATER_CLOUDFLARE_API_TOKEN }}
      HOT_UPDATER_CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.HOT_UPDATER_CLOUDFLARE_D1_DATABASE_ID }}
      HOT_UPDATER_CLOUDFLARE_D1_DATABASE_NAME: ${{ secrets.HOT_UPDATER_CLOUDFLARE_D1_DATABASE_NAME }}
      HOT_UPDATER_CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_ACCESS_KEY_ID }}
      HOT_UPDATER_CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_BUCKET_NAME }}
      HOT_UPDATER_CLOUDFLARE_R2_PRIVATE: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_PRIVATE }}
      HOT_UPDATER_CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.HOT_UPDATER_CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      HOT_UPDATER_CLOUDFLARE_WORKER_NAME: ${{ secrets.HOT_UPDATER_CLOUDFLARE_WORKER_NAME }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # apps/mobile's Gemfile runs CocoaPods through bundler (Ruby 3.3: 3.2 crashes pod install).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile
      - run: pnpm install --frozen-lockfile
      # The app's EXPO_PUBLIC_* values and the bundle signing key the production builds trust.
      - name: Restore the app environment and the bundle signing key
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
          HOT_UPDATER_PRIVATE_KEY: ${{ secrets.HOT_UPDATER_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
          mkdir -p keys
          printf '%s' "$HOT_UPDATER_PRIVATE_KEY" > keys/private-key.pem
      - uses: gronxb/hot-updater/actions/preview@80e8342822d0cd7b69c73d0d56d5cdbd9acd2cbd
        with:
          console-url: https://codex-relay.gron-studio.com
          platforms: ios
          ios-scheme: simulator
          working-directory: apps/mobile
          cli: pnpm exec hot-updater
