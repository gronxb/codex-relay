# Scratch QA of gronxb/hot-updater's preview-ci-speed branch: every @hot-updater
# package packed from that branch (vendor/hot-updater), and actions/preview at its
# commit. Three build lanes run at once (Android on Linux, the iPhone's ad hoc
# .ipa, the Simulator .app), a Linux job deploys the iOS bundle after both iOS
# lanes, and one comment job writes the comment. Do not merge.
name: Hot Updater preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write
  # infisical() signs in with GitHub OIDC (INFISICAL_MACHINE_IDENTITY_ID).
  id-token: write

concurrency:
  group: hot-updater-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  SENTRY_DISABLE_AUTO_UPLOAD: "true"
  INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}

jobs:
  android:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.preview.outputs.result }}
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: pnpm install --frozen-lockfile
      - name: Restore the app environment
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
      - name: Pull the app's client API key
        working-directory: apps/mobile
        run: |
          umask 077
          pnpm exec hot-updater secrets pull --only HOT_UPDATER_API_KEY --out .env.hotupdater.rc22 --force < /dev/null
          grep -c '^HOT_UPDATER_API_KEY=.' .env.hotupdater.rc22
      # The docs' Gradle memory settings.
      - name: Cap the Kotlin daemon's heap
        run: |
          mkdir -p ~/.gradle
          echo "kotlin.daemon.jvmargs=-Xmx2g" >> ~/.gradle/gradle.properties
      - id: preview
        uses: gronxb/hot-updater/actions/preview@4e6be15d3c1bdcf2e2a01e323d87371f704192a5
        with:
          console-url: https://codex-relay.gron-studio.com
          platforms: android
          android-scheme: apk
          comment: false
          working-directory: apps/mobile
          cli: pnpm exec hot-updater

  ios-adhoc:
    if: github.event.action != 'closed'
    runs-on: macos-latest
    outputs:
      result: ${{ steps.preview.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile
      - run: pnpm install --frozen-lockfile
      - name: Restore the app environment
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
      - name: Pull the app's client API key
        working-directory: apps/mobile
        run: |
          umask 077
          pnpm exec hot-updater secrets pull --only HOT_UPDATER_API_KEY --out .env.hotupdater.rc22 --force < /dev/null
          grep -c '^HOT_UPDATER_API_KEY=.' .env.hotupdater.rc22
      - id: preview
        uses: gronxb/hot-updater/actions/preview@4e6be15d3c1bdcf2e2a01e323d87371f704192a5
        with:
          console-url: https://codex-relay.gron-studio.com
          platforms: ios
          ios-scheme: adhoc
          # The ios-deploy job deploys the iOS bundle after both iOS lanes.
          deploy: false
          comment: false
          working-directory: apps/mobile
          cli: pnpm exec hot-updater

  ios-simulator:
    if: github.event.action != 'closed'
    runs-on: macos-latest
    outputs:
      result: ${{ steps.preview.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile
      - run: pnpm install --frozen-lockfile
      - name: Restore the app environment
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
      - name: Pull the app's client API key
        working-directory: apps/mobile
        run: |
          umask 077
          pnpm exec hot-updater secrets pull --only HOT_UPDATER_API_KEY --out .env.hotupdater.rc22 --force < /dev/null
          grep -c '^HOT_UPDATER_API_KEY=.' .env.hotupdater.rc22
      - id: preview
        uses: gronxb/hot-updater/actions/preview@4e6be15d3c1bdcf2e2a01e323d87371f704192a5
        with:
          console-url: https://codex-relay.gron-studio.com
          platforms: ios
          # QA: a real failure on attempt 1 (a scheme whose xcodebuild flag
          # doesn't exist), then "Re-run failed jobs" runs the real scheme.
          ios-scheme: ${{ github.run_attempt == '1' && 'simulatorBroken' || 'simulator' }}
          deploy: false
          comment: false
          working-directory: apps/mobile
          cli: pnpm exec hot-updater
      # QA evidence: the architectures of the tracked Simulator app.
      - name: The Simulator app's architectures
        if: steps.preview.outputs.result != ''
        working-directory: apps/mobile
        env:
          BUILD_ID: ${{ fromJSON(steps.preview.outputs.result || '{}').previews[0].nativeBuild.id }}
        run: |
          pnpm exec hot-updater native-build download "$BUILD_ID" -o "$RUNNER_TEMP/sim.zip"
          mkdir -p "$RUNNER_TEMP/sim" && unzip -q -o "$RUNNER_TEMP/sim.zip" -d "$RUNNER_TEMP/sim"
          app=$(find "$RUNNER_TEMP/sim" -name '*.app' -maxdepth 3 | head -1)
          exe=$(/usr/libexec/PlistBuddy -c 'Print CFBundleExecutable' "$app/Info.plist")
          echo "app: $app"
          lipo -archs "$app/$exe"
          du -sh "$app"

  # One iOS bundle on Linux, after both iOS lanes, against their builds.
  ios-deploy:
    needs: [ios-adhoc, ios-simulator]
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.preview.outputs.result }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the app environment
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
      - name: Pull the app's client API key
        working-directory: apps/mobile
        run: |
          umask 077
          pnpm exec hot-updater secrets pull --only HOT_UPDATER_API_KEY --out .env.hotupdater.rc22 --force < /dev/null
          grep -c '^HOT_UPDATER_API_KEY=.' .env.hotupdater.rc22
      - id: preview
        uses: gronxb/hot-updater/actions/preview@4e6be15d3c1bdcf2e2a01e323d87371f704192a5
        with:
          console-url: https://codex-relay.gron-studio.com
          platforms: ios
          ios-scheme: adhoc, simulator
          build: false
          comment: false
          working-directory: apps/mobile
          cli: pnpm exec hot-updater

  comment:
    needs: [android, ios-adhoc, ios-simulator, ios-deploy]
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    steps:
      - uses: gronxb/hot-updater/actions/preview@4e6be15d3c1bdcf2e2a01e323d87371f704192a5
        with:
          console-url: https://codex-relay.gron-studio.com
          mode: comment
          results: |
            android ${{ needs.android.result }} ${{ needs.android.outputs.result }}
            ios-adhoc ${{ needs.ios-adhoc.result }} ${{ needs.ios-adhoc.outputs.result }}
            ios-simulator ${{ needs.ios-simulator.result }} ${{ needs.ios-simulator.outputs.result }}
            ios-deploy ${{ needs.ios-deploy.result }} ${{ needs.ios-deploy.outputs.result }}

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Restore the app environment
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
      - name: Pull the app's client API key
        working-directory: apps/mobile
        run: |
          umask 077
          pnpm exec hot-updater secrets pull --only HOT_UPDATER_API_KEY --out .env.hotupdater.rc22 --force < /dev/null
      - uses: gronxb/hot-updater/actions/preview@4e6be15d3c1bdcf2e2a01e323d87371f704192a5
        with:
          console-url: https://codex-relay.gron-studio.com
          working-directory: apps/mobile
          cli: pnpm exec hot-updater
