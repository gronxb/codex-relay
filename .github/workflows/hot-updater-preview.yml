# v1.2 QA: Hot Updater's pull request previews on codex-relay (actions/preview, hot-updater 1.2.0-rc.11).
# Every run deploys this pull request's bundle to its pr-<number> channel and, unless the registry
# already has an iOS Simulator build for the project's fingerprint there, builds and registers one
# that embeds that channel (app.config.ts reads PREVIEW_CHANNEL). The comment links the build's
# download. Closing the pull request deletes the channel with its bundles and native builds.
# Production's channel is never touched.
name: Hot Updater preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write
  # infisical() signs in with GitHub OIDC (INFISICAL_MACHINE_IDENTITY_ID).
  id-token: write

concurrency:
  group: hot-updater-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      SENTRY_DISABLE_AUTO_UPLOAD: "true"
      # app.config.ts passes this to the @hot-updater/expo config plugin, so the preview build
      # embeds the pull request's channel (the action's default channel, pr-<number>).
      PREVIEW_CHANNEL: pr-${{ github.event.number }}
      # hot-updater.config.ts reads every deploy credential (Cloudflare tokens, the bundle
      # signing key) from Infisical. It signs in with GitHub OIDC as a read-only (Viewer)
      # machine identity bound to this repository's pull_request runs on the QA branch.
      INFISICAL_MACHINE_IDENTITY_ID: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      # apps/mobile's Gemfile runs CocoaPods through bundler (Ruby 3.3: 3.2 crashes pod install).
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: apps/mobile
      - run: pnpm install --frozen-lockfile
      # The app's EXPO_PUBLIC_* values.
      - name: Restore the app environment
        working-directory: apps/mobile
        env:
          MOBILE_ENV: ${{ secrets.MOBILE_ENV_RC22 }}
        run: |
          umask 077
          printf '%s' "$MOBILE_ENV" > .env
      # Which Infisical sign-in this job offers (variable names only, never values).
      - name: Show the Infisical sign-in
        run: |
          for name in INFISICAL_TOKEN INFISICAL_UNIVERSAL_AUTH_CLIENT_ID INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET INFISICAL_MACHINE_IDENTITY_ID ACTIONS_ID_TOKEN_REQUEST_URL ACTIONS_ID_TOKEN_REQUEST_TOKEN; do
            if [ -n "${!name:-}" ]; then echo "$name: set"; else echo "$name: unset"; fi
          done
      - uses: gronxb/hot-updater/actions/preview@a5cf3dfb5085d197288bd559811d5ddb74e94260
        with:
          console-url: https://codex-relay.gron-studio.com
          platforms: ios
          ios-scheme: simulator
          working-directory: apps/mobile
          cli: pnpm exec hot-updater
