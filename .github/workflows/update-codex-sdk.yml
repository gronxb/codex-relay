name: Update Codex SDK

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-codex-sdk
  cancel-in-progress: false

jobs:
  update:
    name: Update @openai/codex-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Update Codex SDK
        id: update
        run: |
          current_version="$(node -p 'require("./packages/codex-relay/package.json").dependencies["@openai/codex-sdk"]')"
          latest_version="$(pnpm view @openai/codex-sdk@latest version)"
          codex_cli_version="$(pnpm view "@openai/codex-sdk@$latest_version" dependencies.@openai/codex)"

          if [[ "$current_version" == "$latest_version" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pnpm --filter codex-relay add "@openai/codex@$codex_cli_version" "@openai/codex-sdk@$latest_version" --save-exact --lockfile-only
          changeset_path=".changeset/update-codex-sdk-$latest_version.md"
          printf -- '---\n"codex-relay": patch\n---\n\nUpdate `@openai/codex-sdk` to `%s` and pin its Codex CLI `%s` for app-server compatibility.\n' "$latest_version" "$codex_cli_version" > "$changeset_path"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "changeset=$changeset_path" >> "$GITHUB_OUTPUT"
          echo "version=$latest_version" >> "$GITHUB_OUTPUT"

      - name: Install updated dependencies
        if: steps.update.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Test
        if: steps.update.outputs.changed == 'true'
        run: pnpm test

      - name: Typecheck
        if: steps.update.outputs.changed == 'true'
        run: pnpm typecheck

      - name: Lint
        if: steps.update.outputs.changed == 'true'
        run: pnpm lint

      - name: Commit update branch
        if: steps.update.outputs.changed == 'true'
        env:
          CHANGESET_PATH: ${{ steps.update.outputs.changeset }}
          CODEX_SDK_VERSION: ${{ steps.update.outputs.version }}
          UPDATE_BRANCH: automation/update-codex-sdk
        run: |
          git switch --create "$UPDATE_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CHANGESET_PATH" packages/codex-relay/package.json pnpm-lock.yaml
          git commit -m "chore: update @openai/codex-sdk to $CODEX_SDK_VERSION"
          git push --force-with-lease origin "HEAD:refs/heads/$UPDATE_BRANCH"

      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          CODEX_SDK_VERSION: ${{ steps.update.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: automation/update-codex-sdk
        run: |
          title="chore: update @openai/codex-sdk to $CODEX_SDK_VERSION"
          body="Update @openai/codex-sdk to $CODEX_SDK_VERSION and add a codex-relay patch changeset."
          pull_request="$(gh pr list --base main --head "$UPDATE_BRANCH" --state open --json number --jq '.[0].number')"

          if [[ -n "$pull_request" ]]; then
            gh pr edit "$pull_request" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$UPDATE_BRANCH" --title "$title" --body "$body"
          fi
